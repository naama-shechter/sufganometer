name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the APK to the "latest" release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx ng build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sufganometer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # קישור קבוע להורדה ישירה לטלפון, בלי zip ובלי התחברות:
      # https://github.com/<owner>/<repo>/releases/latest/download/sufganometer.apk
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sufganometer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest sufganometer.apk \
            --title "סופגנומטר – הגרסה האחרונה" \
            --notes "נבנה אוטומטית מ-commit ${{ github.sha }}. להתקנה: מורידים את sufganometer.apk בטלפון ופותחים." \
            --target "${{ github.sha }}" \
            --latest
